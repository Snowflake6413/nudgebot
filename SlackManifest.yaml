display_information:
  name: Nudgebot
  description: A Slack bot that can manage your personal channels easily and simple.
  background_color: "#3e59ab"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: nudgebot
    always_online: true
  slash_commands:
    - command: /{SLASH_PREFIX}-restrict-from-channel
      description: Restrict a user from joining your channel.
      usage_hint: "@user"
      should_escape: true
    - command: /are-you-alive
      description: Check if the bot is alive or not.
      should_escape: false
    - command: /unrestrict-from-channel
      description: Unrestrict a user from joining your channel.
      usage_hint: "@user"
      should_escape: true
    - command: /list-restricted-users
      description: List of restrictes users for your channel.
      should_escape: false
    - command: /advertise-channel
      description: Advertise your channel to the globe!
      should_escape: false
    - command: /channel-purge
      description: Kick out inactive people from your channel
      should_escape: false
    - command: /join-a-nice-channel
      description: Placeholder
      should_escape: false
oauth_config:
  scopes:
    user:
      - usergroups:read
    bot:
      - im:write
      - channels:history
      - channels:read
      - channels:write.invites
      - chat:write
      - commands
      - groups:history
      - groups:read
      - groups:write.invites
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - usergroups:read
      - usergroups:write
      - mpim:write
      - groups:write
      - channels:manage
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - member_joined_channel
      - member_left_channel
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - subteam_members_changed
      - subteam_updated
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
